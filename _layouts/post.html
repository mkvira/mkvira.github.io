---
layout: default
---
<main class="article-page page-width">
  <article>
    <p class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}{% if page.categories.size > 0 %} · {{ page.categories | first }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="article-deck">{{ page.description }}</p>{% endif %}
    <div class="article-body">{{ content }}</div>
  </article>
</main>
